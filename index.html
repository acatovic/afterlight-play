<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f12">
  <title>Afterlight · Mars Observatory</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100svh; background: #080f12; color: #c4d3d2; font: 14px/1.6 ui-monospace, monospace; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 1600px); }
    header, footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
    header { margin-bottom: 16px; }
    h1 { font-size: 16px; font-weight: 500; letter-spacing: .28em; margin: 0; color: #e2e8dd; }
    .location { font-size: 11px; letter-spacing: .12em; color: #81969a; }
    #player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #04080a; border: 1px solid #20383b; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    canvas:focus-visible { outline: 2px solid #55cfc2; outline-offset: -2px; }
    #overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 16px; padding: 24px; background: #080f12; }
    #overlay p { margin: 0; }
    button { background: transparent; color: #69e0d0; border: 1px solid #376965; padding: 10px 18px; cursor: pointer; font: inherit; }
    button:hover, button:focus-visible { background: #15302f; outline: 2px solid #69e0d0; outline-offset: 3px; }
    button:disabled { opacity: .4; cursor: default; }
    progress { width: min(100%, 320px); margin: auto; accent-color: #69e0d0; }
    #status { max-width: 640px; color: #b8c9c9; overflow-wrap: anywhere; }
    footer { margin-top: 12px; color: #81969a; font-size: 11px; }
    kbd { color: #b7d3cf; font: inherit; }
    #player:fullscreen { border: 0; display: grid; place-items: center; background: #000; }
    #player:fullscreen canvas { width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); }
    @media (max-width: 700px) { body { padding: 12px; } .location { font-size: 9px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AFTERLIGHT</h1>
      <span class="location">MARS ORBIT / RESEARCH DECK B</span>
    </header>
    <section id="player" aria-label="Afterlight game">
      <canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="Game. Use A and D to walk, E to interact."></canvas>
      <div id="overlay">
        <p class="location">MARS OBSERVATORY</p>
        <button id="start" type="button">Enter the station</button>
        <progress id="progress" max="1" value="0" aria-label="Loading game" hidden></progress>
        <p id="status" role="status">A keyboard is required. Click to start, then click the game to enable audio.</p>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
    </section>
    <footer>
      <span><kbd>A / D</kbd> WALK &nbsp; <kbd>SHIFT</kbd> HURRY &nbsp; <kbd>E</kbd> INTERACT &nbsp; <kbd>W / S</kbd> MENU</span>
      <button id="fullscreen" type="button" disabled>Fullscreen</button>
    </footer>
    <noscript>This game needs JavaScript and WebGL 2 enabled in your browser.</noscript>
  </main>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const player = document.getElementById("player");
    const overlay = document.getElementById("overlay");
    const start = document.getElementById("start");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");
    const fullscreen = document.getElementById("fullscreen");
    function fail(message) {
      overlay.hidden = false;
      start.hidden = true;
      progress.hidden = true;
      status.textContent = "The station could not load. " + message;
      retry.hidden = false;
    }
    retry.addEventListener("click", () => location.reload());
    canvas.addEventListener("pointerdown", () => canvas.focus());
    canvas.addEventListener("keydown", event => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab", "PageUp", "PageDown"].includes(event.key)) event.preventDefault();
    });
    // Unity's Input.inputString needs the printable keypress. Canceling Space
    // on keydown suppresses it; cancel scrolling only after keypress is emitted.
    canvas.addEventListener("keypress", event => {
      if (event.key === " ") event.preventDefault();
    });
    fullscreen.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await player.requestFullscreen();
      } catch (error) { console.warn("Fullscreen unavailable", error); }
      canvas.focus();
    });
    document.addEventListener("fullscreenchange", () => {
      fullscreen.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      canvas.focus();
    });
    start.addEventListener("click", () => {
      start.hidden = true;
      progress.hidden = false;
      status.textContent = "Connecting to the observatory…";
      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.staging.data.unityweb",
        frameworkUrl: buildUrl + "/Web.staging.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.staging.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Afterlight",
        productName: "Afterlight — Mars Orbit",
        productVersion: "1.0",
        // Keep the game's pixel grid stable, including on Retina screens.
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
        showBanner: (message, type) => {
          if (type === "error") fail(message);
          else console.warn(message);
        }
      };
      const script = document.createElement("script");
      script.src = buildUrl + "/Web.staging.loader.js";
      script.onerror = () => fail("Check your connection and reload the page.");
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          progress.value = value;
          status.textContent = "Loading the station… " + Math.round(value * 100) + "%";
        }).then(() => {
          overlay.hidden = true;
          fullscreen.disabled = !document.fullscreenEnabled;
          canvas.focus();
        }).catch(error => fail(String(error)));
      };
      document.body.appendChild(script);
    }, { once: true });
  </script>
</body>
</html>
